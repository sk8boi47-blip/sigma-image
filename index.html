<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a12">
  <meta name="description" content="Spin the Sigma image roulette and reveal a meme prize.">
  <title>Sigma Meme Roulette</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f3ff;
      --muted: #aaa8bd;
      --panel: rgba(20, 21, 37, .88);
      --line: rgba(255,255,255,.11);
      --common: #81c784;
      --uncommon: #58b8e8;
      --rare: #aa78ed;
      --epic: #f39a51;
      --legendary: #f4cd62;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px 44px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 5%, rgba(102, 74, 190, .22), transparent 34rem),
        radial-gradient(ellipse at 95% 72%, rgba(37, 127, 162, .16), transparent 32rem),
        #080a12;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .page { width: min(100%, 1000px); margin: auto; }
    header { text-align: center; margin: 4px 0 28px; }
    .eyebrow { color: #b8a8ff; font-size: .76rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 9px 0 7px; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -.055em; }
    header p { margin: 0; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(280px, .82fr); gap: 22px; align-items: stretch; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 22px 70px rgba(0,0,0,.3);
      backdrop-filter: blur(12px);
    }
    .game { display: grid; justify-items: center; padding: 25px 20px 22px; }
    .wheel-shell { position: relative; width: min(100%, 390px); aspect-ratio: 1; display: grid; place-items: center; }
    .wheel {
      position: absolute; inset: 0; border-radius: 50%;
      border: 8px solid #e7ddff;
      box-shadow: 0 0 0 5px rgba(150,125,220,.16), 0 18px 48px rgba(0,0,0,.52);
      background: conic-gradient(var(--common) 0deg 216deg, var(--uncommon) 216deg 306deg, var(--rare) 306deg 342deg, var(--epic) 342deg 356.4deg, var(--legendary) 356.4deg 360deg);
      will-change: transform;
    }
    .wheel::after {
      content: ""; position: absolute; inset: 9px; border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%; pointer-events: none;
    }
    .pointer {
      position: absolute; z-index: 3; top: -5px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent;
      border-top: 34px solid #fff; filter: drop-shadow(0 3px 4px #000);
    }
    .spin-button {
      position: relative; z-index: 4; width: 100px; height: 100px; border-radius: 50%;
      border: 6px solid #f5edff; color: #fff; background: #171329;
      font: inherit; font-size: 1.12rem; font-weight: 900; letter-spacing: .12em;
      cursor: pointer; box-shadow: 0 6px 22px rgba(0,0,0,.5), inset 0 0 20px rgba(137,101,223,.35);
      transition: transform .15s ease, filter .15s ease;
    }
    .spin-button:hover:not(:disabled) { transform: scale(1.06); filter: brightness(1.15); }
    .spin-button:disabled { cursor: wait; opacity: .85; }
    .hint { margin: 18px 0 0; color: var(--muted); font-size: .9rem; text-align: center; }
    .spin-count { margin: 7px 0 0; color: #d4c8ff; font-size: .88rem; font-weight: 700; text-align: center; }
    .prize-panel { display: flex; flex-direction: column; padding: 22px; }
    .prize-panel h2 { margin: 0 0 15px; font-size: 1.18rem; }
    .prize-picture {
      position: relative; display: grid; place-items: center; overflow: hidden; flex: 1;
      min-height: 270px; aspect-ratio: 1; border-radius: 17px;
      border: 1px solid var(--line); background: linear-gradient(145deg, #181a2b, #0d0f18);
    }
    .mystery {
      display: grid; place-items: center; width: 100%; height: 100%;
      color: #e5dcff; font-size: clamp(8rem, 20vw, 12rem); font-weight: 900;
      line-height: 1; text-shadow: 0 0 35px rgba(173,139,255,.55);
      background: radial-gradient(circle at 50% 42%, rgba(130,101,212,.22), transparent 50%);
    }
    .prize-picture img { width: 100%; height: 100%; object-fit: contain; background: #10111b; }
    [hidden] { display: none !important; }
    .prize-copy { min-height: 75px; padding: 15px 2px 0; }
    .rarity { display: inline-block; padding: 5px 9px; border-radius: 999px; font-size: .72rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .rarity.common { color: #c9f7cb; background: rgba(129,199,132,.18); }
    .rarity.uncommon { color: #c8efff; background: rgba(88,184,232,.18); }
    .rarity.rare { color: #e1ceff; background: rgba(170,120,237,.2); }
    .rarity.epic { color: #ffdfbe; background: rgba(243,154,81,.2); }
    .rarity.legendary { color: #fff0b8; background: rgba(244,205,98,.2); }
    .prize-name { margin: 8px 0 0; font-size: 1.12rem; font-weight: 750; }
    .status { min-height: 1.4em; margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
    .odds { margin-top: 18px; padding: 18px 20px; }
    .odds h2 { margin: 0 0 12px; font-size: 1rem; }
    .odds-list { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
    .odds-item { min-width: 0; padding: 10px 8px; border: 1px solid var(--line); border-radius: 12px; text-align: center; }
    .swatch { display: block; width: 10px; height: 10px; margin: 0 auto 6px; border-radius: 50%; background: var(--tier); }
    .odds-item strong { display: block; font-size: .76rem; }
    .odds-item span:last-child { color: var(--muted); font-size: .78rem; }
    footer { padding-top: 18px; color: #747388; text-align: center; font-size: .8rem; }
    @media (max-width: 720px) {
      body { padding: 24px 14px 34px; }
      .layout { grid-template-columns: 1fr; }
      .wheel-shell { width: min(100%, 340px); }
      .prize-picture { min-height: 240px; }
      .odds { padding: 16px 12px; }
      .odds-list { gap: 5px; }
      .odds-item { padding: 9px 3px; }
      .odds-item strong { font-size: .66rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">Sigma presents</div>
      <h1>Meme Drop Roulette</h1>
      <p>Give it a spin and see what you get.</p>
    </header>
    <section class="layout" aria-label="Meme roulette game">
      <div class="panel game">
        <div class="wheel-shell">
          <div class="pointer" aria-hidden="true"></div>
          <div class="wheel" id="wheel" aria-hidden="true"></div>
          <button class="spin-button" id="spinButton" type="button">SPIN</button>
        </div>
        <p class="hint">The pointer lands on your rarity.</p>
        <p class="spin-count" id="spinCount" aria-live="polite">3 of 3 spins left</p>
      </div>
      <section class="panel prize-panel" aria-labelledby="prizeHeading">
        <h2 id="prizeHeading">Your prize</h2>
        <div class="prize-picture">
          <div class="mystery" id="mystery" role="img" aria-label="Mystery image">?</div>
          <img id="prizeImage" alt="" hidden>
        </div>
        <div class="prize-copy" aria-live="polite">
          <span class="rarity" id="rarity" hidden></span>
          <p class="prize-name" id="prizeName">Mystery prize</p>
          <p class="status" id="status">Press SPIN to reveal an image.</p>
        </div>
      </section>
    </section>
    <section class="panel odds" aria-labelledby="oddsHeading">
      <h2 id="oddsHeading">Rarity odds</h2>
      <div class="odds-list" id="oddsList"></div>
    </section>
    <footer>Each spin is random. Good luck!</footer>
  </main>
  <script>
    const prizes = [
      { rarity: "Common", weight: 60, color: "#81c784", name: "Pleading Cat", image: "images/common-pleading-cat.jpg" },
      { rarity: "Uncommon", weight: 25, color: "#58b8e8", name: "Cat at 3 AM", image: "images/uncommon-cat-3am.jpg" },
      { rarity: "Rare", weight: 10, color: "#aa78ed", name: "Shocked Face", image: "images/rare-shocked-face.jpg" },
      { rarity: "Epic", weight: 4, color: "#f39a51", name: "AI Images Gandalf", image: "images/epic-ai-gandalf.jpg" },
      { rarity: "Legendary", weight: 1, color: "#f4cd62", name: "Doctor Appointment Meme", image: "images/legendary-doctor-meme.jpg" }
    ];
    const wheel = document.getElementById("wheel");
    const spinButton = document.getElementById("spinButton");
    const prizeImage = document.getElementById("prizeImage");
    const mystery = document.getElementById("mystery");
    const prizeName = document.getElementById("prizeName");
    const rarityLabel = document.getElementById("rarity");
    const status = document.getElementById("status");
    const oddsList = document.getElementById("oddsList");
    const spinCount = document.getElementById("spinCount");
    const totalWeight = prizes.reduce((sum, prize) => sum + prize.weight, 0);
    const SPIN_LIMIT = 3;
    const SPIN_WINDOW_MS = 24 * 60 * 60 * 1000;
    const SPIN_STORAGE_KEY = "sigmaRouletteSpinTimesV1";
    let spinTimes = loadSpinTimes();
    let currentRotation = 0;
    let isSpinning = false;
    let wasLocked = spinTimes.length >= SPIN_LIMIT;

    function loadSpinTimes() {
      try {
        const saved = JSON.parse(localStorage.getItem(SPIN_STORAGE_KEY) || "[]");
        const now = Date.now();
        return Array.isArray(saved) ? saved.filter(time => Number.isFinite(time) && time <= now && now - time < SPIN_WINDOW_MS) : [];
      } catch {
        return [];
      }
    }

    function formatWait(milliseconds) {
      const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return hours > 0 ? hours + "h " + minutes + "m" : minutes > 0 ? minutes + "m " + seconds + "s" : seconds + "s";
    }

    function updateSpinQuota() {
      const now = Date.now();
      spinTimes = spinTimes.filter(time => Number.isFinite(time) && time <= now && now - time < SPIN_WINDOW_MS);
      const remaining = Math.max(0, SPIN_LIMIT - spinTimes.length);
      const nextRefresh = spinTimes.length ? SPIN_WINDOW_MS - (now - spinTimes[0]) : 0;

      try {
        localStorage.setItem(SPIN_STORAGE_KEY, JSON.stringify(spinTimes));
      } catch {
        // The spin handler will show an error if this browser cannot save its limit.
      }

      spinCount.textContent = remaining === SPIN_LIMIT
        ? remaining + " of " + SPIN_LIMIT + " spins left"
        : remaining + " of " + SPIN_LIMIT + " spins left · next returns in " + formatWait(nextRefresh);
      spinButton.disabled = isSpinning || remaining === 0;

      if (remaining === 0 && !isSpinning) {
        status.textContent = "No spins left. One returns in " + formatWait(nextRefresh) + ".";
      } else if (wasLocked && remaining > 0 && !isSpinning) {
        status.textContent = "A spin has refreshed. Press SPIN to play.";
      }
      wasLocked = remaining === 0;
    }

    let cursor = 0;
    const segments = prizes.map(prize => {
      const start = cursor;
      cursor += prize.weight / totalWeight * 360;
      return `${prize.color} ${start}deg ${cursor}deg`;
    });
    wheel.style.background = `conic-gradient(${segments.join(", ")})`;
    oddsList.innerHTML = prizes.map(prize =>
      `<div class="odds-item"><span class="swatch" style="--tier:${prize.color}"></span><strong>${prize.rarity}</strong><span>${prize.weight}%</span></div>`
    ).join("");

    function pickPrize() {
      let roll = Math.random() * totalWeight;
      for (const prize of prizes) {
        roll -= prize.weight;
        if (roll < 0) return prize;
      }
      return prizes[0];
    }

    function spin() {
      if (isSpinning) return;
      spinTimes = loadSpinTimes();
      if (spinTimes.length >= SPIN_LIMIT) {
        updateSpinQuota();
        return;
      }

      spinTimes.push(Date.now());
      try {
        localStorage.setItem(SPIN_STORAGE_KEY, JSON.stringify(spinTimes));
      } catch {
        spinTimes.pop();
        status.textContent = "Your browser storage is unavailable, so the spin limit cannot be saved.";
        return;
      }

      isSpinning = true;
      updateSpinQuota();
      const prize = pickPrize();
      const start = prizes.slice(0, prizes.indexOf(prize)).reduce((sum, item) => sum + item.weight, 0) / totalWeight * 360;
      const center = start + prize.weight / totalWeight * 180;
      const currentMod = ((currentRotation % 360) + 360) % 360;
      const delta = ((-center - currentMod) % 360 + 360) % 360;
      const turns = 5 + Math.floor(Math.random() * 3);
      currentRotation += turns * 360 + delta;

      prizeName.textContent = "Spinning…";
      status.textContent = "The wheel is deciding your drop.";
      wheel.style.transition = window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ? "transform 300ms ease-out"
        : "transform 4.8s cubic-bezier(.12,.72,.12,1)";
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 350 : 4900;
      window.setTimeout(() => {
        mystery.hidden = true;
        prizeImage.src = prize.image;
        prizeImage.alt = prize.name;
        prizeImage.hidden = false;
        prizeName.textContent = prize.name;
        rarityLabel.textContent = prize.rarity;
        rarityLabel.className = `rarity ${prize.rarity.toLowerCase()}`;
        rarityLabel.hidden = false;
        status.textContent = `${prize.weight}% chance per spin`;
        isSpinning = false;
        updateSpinQuota();
        if (prize.rarity === "Legendary") {
          status.textContent = "Gold Legendary! Sending the owner alert…";
          fetch("/api/legendary-win", { method: "POST" })
            .then(response => {
              if (!response.ok) throw new Error("Alert service unavailable");
              status.textContent = "Gold Legendary! The site owner was emailed.";
            })
            .catch(() => {
              status.textContent = "Gold Legendary! The email alert is not connected yet.";
            });
        }
      }, duration);
    }

    spinButton.addEventListener("click", spin);
    updateSpinQuota();
    window.setInterval(updateSpinQuota, 1000);
  </script>
</body>
</html>
